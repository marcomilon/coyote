<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="480" height="400" fill="none" stroke-linejoin="round" stroke-linecap="round">
  <!-- Sobre nosotros: a small shop with its page on a phone and a trust badge, in the site's "rótulo" colors. -->
  <!-- Sun -->
  <circle cx="112" cy="78" r="46" fill="#f2b825" stroke="#1c1714" stroke-width="3"/>

  <!-- Ground -->
  <path d="M24 352h432" stroke="#1c1714" stroke-width="3"/>

  <!-- Shop: hard shadow, then the front -->
  <rect x="62" y="150" width="236" height="202" fill="#1c1714"/>
  <rect x="52" y="140" width="236" height="202" fill="#f5e9d6" stroke="#1c1714" stroke-width="3"/>

  <!-- Sign over the awning -->
  <rect x="96" y="92" width="156" height="38" rx="6" fill="#1c1714"/>
  <rect x="90" y="86" width="156" height="38" rx="6" fill="#d93425" stroke="#1c1714" stroke-width="3"/>
  <path d="M112 105h22M144 105h48M202 105h22" stroke="#fff8ec" stroke-width="5"/>

  <!-- Awning: stripes and a scalloped edge -->
  <rect x="44" y="132" width="252" height="34" fill="#fff8ec" stroke="#1c1714" stroke-width="3"/>
  <path d="M72 132v34M100 132v34M128 132v34M156 132v34M184 132v34M212 132v34M240 132v34M268 132v34" stroke="#1c1714" stroke-width="3"/>
  <path d="M44.5 133.5h27v31h-27zM100.5 133.5h27v31h-27zM156.5 133.5h27v31h-27zM212.5 133.5h27v31h-27zM268.5 133.5h26v31h-26z" fill="#d93425"/>
  <path d="M44 166a14 14 0 0 0 28 0a14 14 0 0 0 28 0a14 14 0 0 0 28 0a14 14 0 0 0 28 0a14 14 0 0 0 28 0a14 14 0 0 0 28 0a14 14 0 0 0 28 0a14 14 0 0 0 28 0a14 14 0 0 0 28 0" fill="#fff8ec" stroke="#1c1714" stroke-width="3"/>

  <!-- Window with a little plant -->
  <rect x="76" y="204" width="110" height="84" rx="4" fill="#7ba4f0" stroke="#1c1714" stroke-width="3"/>
  <path d="M131 204v84M76 246h110" stroke="#1c1714" stroke-width="3"/>
  <path d="M90 288v-10h26v10" fill="#d93425" stroke="#1c1714" stroke-width="3"/>
  <path d="M103 278c-10-10-10-20 0-26c10 6 10 16 0 26z" fill="#5bd27a" stroke="#1c1714" stroke-width="3"/>

  <!-- Door -->
  <rect x="204" y="214" width="64" height="128" rx="4" fill="#1e4fa3" stroke="#1c1714" stroke-width="3"/>
  <rect x="216" y="228" width="40" height="40" rx="3" fill="#7ba4f0" stroke="#1c1714" stroke-width="3"/>
  <circle cx="256" cy="290" r="4" fill="#f2b825" stroke="#1c1714" stroke-width="2"/>

  <!-- Phone: hard shadow, body, screen -->
  <rect x="312" y="176" width="112" height="196" rx="20" fill="#1c1714" opacity=".3"/>
  <rect x="300" y="164" width="112" height="196" rx="20" fill="#1c1714"/>
  <rect x="310" y="180" width="92" height="166" rx="12" fill="#fff8ec"/>
  <rect x="340" y="170" width="32" height="5" rx="2.5" fill="#fff8ec" opacity=".35"/>
  <!-- The shop's page on the phone -->
  <rect x="318" y="190" width="76" height="38" rx="6" fill="#d93425"/>
  <path d="M328 202h40M328 214h26" stroke="#fff8ec" stroke-width="5"/>
  <path d="M320 242h58M320 254h70M320 266h46" stroke="#1c1714" stroke-width="4" opacity=".55"/>
  <!-- WhatsApp-style button -->
  <rect x="318" y="294" width="76" height="34" rx="17" fill="#5bd27a" stroke="#1c1714" stroke-width="3"/>
  <path d="M347 304a9 9 0 1 1 3 15.5l-5 1.5l1.5-4.5a9 9 0 0 1 .5-12.5z" fill="#fff8ec" stroke="#1c1714" stroke-width="2.5"/>
  <path d="M364 311h18" stroke="#1c1714" stroke-width="4"/>

  <!-- Trust badge: shield with a check -->
  <path d="M408 56l44 16v34c0 30-20 50-44 60c-24-10-44-30-44-60V72z" fill="#1c1714" transform="translate(6 6)"/>
  <path d="M408 56l44 16v34c0 30-20 50-44 60c-24-10-44-30-44-60V72z" fill="#5bd27a" stroke="#1c1714" stroke-width="3"/>
  <path d="M389 108l13 13l25-27" stroke="#1c1714" stroke-width="7"/>

  <!-- Sparkles -->
  <path d="M332 92l4 10l10 4l-10 4l-4 10l-4-10l-10-4l10-4z" fill="#f2b825" stroke="#1c1714" stroke-width="2.5"/>
  <path d="M448 210l3 7l7 3l-7 3l-3 7l-3-7l-7-3l7-3z" fill="#7ba4f0" stroke="#1c1714" stroke-width="2.5"/>
  <path d="M30 220l3 7l7 3l-7 3l-3 7l-3-7l-7-3l7-3z" fill="#d93425" stroke="#1c1714" stroke-width="2.5"/>
</svg>
